<script>
"use strict";
/* ===== IA ABERTA (sem conta) — vários provedores com troca automática =====
   Ordem de tentativa: cada provedor é tentado UMA vez (limite de tempo curto); se falhar, passa ao próximo.
   Chave opcional (melhora limites): coloque em AI_KEY ou rode localStorage.setItem("jv_ai_key","SUA_CHAVE"). */
const AI_KEY="";
function aiProviders(img){
 let key=AI_KEY;try{key=localStorage.getItem("jv_ai_key")||AI_KEY}catch(e){}
 const L=[];
 if(key)L.push({id:"pollinations-key",url:"https://gen.pollinations.ai/v1/chat/completions",model:"openai",key,vision:true,to:30000});
 L.push({id:"ovh-visao",url:"https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/chat/completions",model:"Qwen2.5-VL-72B-Instruct",vision:true,to:35000});
 L.push({id:"pollinations",url:"https://text.pollinations.ai/openai",model:"openai-fast",vision:false,to:20000});
 L.push({id:"pollinations-vis",url:"https://text.pollinations.ai/openai",model:"openai",vision:true,to:30000});
 L.push({id:"ovh-texto",url:"https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/chat/completions",model:"Meta-Llama-3_3-70B-Instruct",vision:false,to:25000});
 return L.filter(p=>img?p.vision:true);
}
const _bad={};window.__aiLog=[];
function _blobURL(b){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no({code:"image"});r.readAsDataURL(b)})}
async function _openCall(prompt,opts){
 opts=opts||{};
 let msgs=Array.isArray(prompt)?prompt.map(m=>({role:m.role,content:m.content})):[{role:"user",content:String(prompt)}];
 const hasImg=!!(opts.images&&opts.images.length);
 if(hasImg){
  const urls=await Promise.all(opts.images.map(i=>typeof i=="string"?i:_blobURL(i)));
  const last=msgs[msgs.length-1];
  last.content=[{type:"text",text:String(last.content)}].concat(urls.map(u=>({type:"image_url",image_url:{url:u}})));
 }
 const provs=aiProviders(hasImg),fails=[];let all429=true;
 const order=provs.filter(p=>!(_bad[p.id]>Date.now())).concat(provs.filter(p=>_bad[p.id]>Date.now()));
 for(const p of order){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),p.to);
  try{
   const h={"Content-Type":"application/json"};if(p.key)h.Authorization="Bearer "+p.key;
   const res=await fetch(p.url,{method:"POST",headers:h,signal:ctl.signal,body:JSON.stringify({model:p.model,messages:msgs,max_tokens:900,temperature:0.3,stream:false})});
   if(!res.ok){fails.push(p.id+":"+res.status);if(res.status!=429)all429=false;_bad[p.id]=Date.now()+(res.status==429?30000:90000);continue}
   const j=await res.json();
   const txt=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
   if(!txt){fails.push(p.id+":vazio");all429=false;_bad[p.id]=Date.now()+30000;continue}
   _bad[p.id]=0;window.__aiLog.push({ok:p.id,t:Date.now()});return{text:String(txt)};
  }catch(e){all429=false;fails.push(p.id+":"+(e&&e.name=="AbortError"?"tempo":"rede"));_bad[p.id]=Date.now()+60000}
  finally{clearTimeout(tm)}
 }
 window.__aiLog.push({falhou:fails,t:Date.now()});
 if(all429&&fails.length)throw{code:"rate_limited"};
 throw{code:"IA: "+fails.join(", ")};
}
function openSample(){
 const f=async(prompt,opts)=>{
  try{if(typeof claude!="undefined"&&claude&&claude.use){const sm=await claude.use("sample");if(sm){const o={...(opts||{})};return await sm(prompt,o)}}}catch(e){if(e&&e.code=="rate_limited"){}}
  return _openCall(prompt,opts)};
 f.limits=async()=>({images:true});
 return f;
}
window.testarIA=async()=>{try{const r=await openSample()("Responda só: ok");console.log("IA OK:",r.text,window.__aiLog);return r.text}catch(e){console.log("IA FALHOU:",e,window.__aiLog);return e}};

/* ===== CONFIG (administrador do projeto) ===== */
const CFG={modoTeste:true,gpsAtivo:window.JV_FEATURES?.gpsEnabled===true,pontosPorDia:10,pontosPlantaNova:5,
 // Recompensas oficiais devem ser cadastradas aqui pela equipe. Vazio = nenhuma recompensa disponível.
 recompensas:[], // ex.: {id:"r1",nome:"...",desc:"...",custo:100,emoji:"🎁",estoque:10}

 let cur=0;if(d.length){const last=d[d.length-1],today=day(Date.now()),yest=day(Date.now()-864e5);if(last==today||last==yest){cur=1;for(let i=d.length-1;i>0;i--){if(Math.round((new Date(d[i]+"T12:00")-new Date(d[i-1]+"T12:00"))/864e5)==1)cur++;else break}}}return{cur,best,total:d.length}}

async function ask(t){
 const q=(t||$("#q").value).trim();if(!q)return;
 tmp.chat=tmp.chat||[];tmp.chat.push({role:"user",content:q});
 const add=(text,sources=[])=>{tmp.chat=tmp.chat.filter(x=>!x.tmp);tmp.chat.push({role:"assistant",content:text,sources});render()};
 tmp.chat.push({role:"assistant",content:"Pesquisando…",tmp:1});render();
 const hist=tmp.chat.filter(m=>!m.tmp).slice(-7,-1).map(m=>({role:m.role,content:m.content}));
 try{
  let sample=await openSample();if(!sample){await new Promise(r=>setTimeout(r,1500));sample=await openSample()}
  if(!sample)return add("A IA não está disponível agora. Verifique a internet e tente de novo.");
  const prompt="Você é a Green AI do Janela Verde, projeto de jardinagem e biodiversidade. Responda em português do Brasil, de forma clara, curta, educativa e segura. Não use dados de cadastro nem faça diagnósticos definitivos de espécies, doenças ou pragas. Se faltar informação, peça detalhes. Histórico recente:\n"+hist.map(m=>m.role+": "+m.content).join("\n")+"\nUsuário: "+q;
  const response=await sample([{role:"user",content:prompt}],{cache:false});add(response.text)
 }catch(e){add(e.code==="rate_limited"?"A IA está ocupada agora. Tente novamente em instantes.":"Não consegui responder agora. Tente novamente.")}
}

function addrLocal(rua){

 if(!/\d/.test(s)&&!/\bs\s*\/?\s*n\b|sem numero/.test(s))return"Inclua o número (ou s/n se não tiver).";

 if(!save()){u.shots.pop();[u.pts,u.pg,u.pc,u.coll]=JSON.parse(snap);return E("Armazenamento cheio. Apague fotos antigas.")}
 closeM();toast(r.ai?"Foto validada pela IA":"Foto salva (sem conferência da IA)");m.forEach((x,i)=>setTimeout(()=>toast(x),2700*(i+1)));render()}
function viewShot(id){const u=U(),s=u.shots.find(x=>x.id==id);if(!s||locked(u,PLI(s.plant)))return toast("Desbloqueie esta planta pelo QR primeiro.");const q=PLI(s.plant);$("#modal").innerHTML=`<div class="modal"><div><img class="big" src="${s.foto}" alt="Foto"><h3>${esc(q?q.nome:"")} · ${KIND[s.kind]}</h3><p class="mu">${fmt(s.ts)}${s.mat?" · "+esc(s.mat):""}<br>${s.ai?"Validada pela IA":"Aceita sem conferência da IA"}</p><p class="mu">Excluir a foto não remove metas já concluídas.</p><button class="btn dng" onclick="if(confirm('Excluir esta foto?')){const u=U();u.shots=u.shots.filter(x=>x.id!='${id}');save();closeM();render()}">Excluir</button><button class="btn sec" onclick="closeM()">Fechar</button></div></div>`}
/* --- Identificar planta pela foto --- */
function openID(){if(!PL.some(p=>!locked(U(),p)))return toast("Desbloqueie uma planta pelo QR antes de fotografá-la.");tmp.idf={foto:null,manual:0,msg:""};idUI()}
function idUI(){const u=U(),t=tmp.idf;$("#modal").innerHTML=`<div class="modal"><div><h2>Identificar planta</h2><p class="mu">Fotografe uma planta já desbloqueada pelo QR Code.</p><div class="center mu" style="margin:8px 0">${t.foto?`<img class="big" src="${t.foto}" alt="Prévia">`:"Nenhuma foto selecionada"}</div>
 <button class="btn sec" onclick="$('#ic').click()">📷 Tirar foto</button><button class="btn sec" onclick="$('#ig').click()">🖼 Escolher da galeria</button><input id="ic" type="file" accept="image/*" capture="environment" hidden onchange="idPick(this)"><input id="ig" type="file" accept="image/*" hidden onchange="idPick(this)">
 <div class="err" id="ie">${esc(t.manual?"":t.msg)}</div>${t.manual?`<p class="warn">${esc(t.msg)}</p>${PL.filter(p=>!locked(u,p)).map(p=>`<button class="btn sec" onclick="idAdd('${p.id}','manual')">${esc(p.nome)}</button>`).join("")}`:`<button class="btn" id="is" onclick="idSend()">Identificar</button>`}<button class="btn sec" onclick="closeM()">Cancelar</button></div></div>`}
function idPick(inp){const f=inp.files[0];if(!f)return;if(!f.type.startsWith("image/"))return $("#ie").textContent="Arquivo não é uma imagem.";const im=new Image(),url=URL.createObjectURL(f);
 im.onload=()=>{const c=document.createElement("canvas"),k=Math.min(1,640/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);tmp.idf.foto=c.toDataURL("image/jpeg",.6);tmp.idf.manual=0;tmp.idf.msg="";URL.revokeObjectURL(url);idUI()};im.onerror=()=>{$("#ie").textContent="Não consegui abrir esta imagem."};im.src=url}
async function jvID(foto){try{const sm=await openSample();if(!sm)return{ai:0};const lim=await sm.limits();if(!lim||!lim.images)return{ai:0};
 const q='Você identifica plantas de um projeto escolar. Olhe a foto e responda APENAS JSON {"id":"onze"|"lambari"|"tradescantia"|"trapoeraba"|"capim"|"jabuticaba"|"nenhuma","confianca":"alta"|"media"|"baixa","descricao":"até 15 palavras"}. Opções: onze = onze-horas (Portulaca grandiflora, suculenta de folhas cilíndricas e flores coloridas); lambari = lambari-roxo (Tradescantia de folhas roxas); tradescantia = Tradescantia de folhas verdes, listradas de prata ou verde-arroxeadas; trapoeraba = trapoeraba (Commelina, flor azul de três pétalas); capim = capim-limão (touceira de folhas longas e finas); jabuticaba = muda de jabuticabeira (Plinia cauliflora). Use "nenhuma" se não houver uma dessas plantas. Só use confianca "alta" se tiver certeza; para jabuticaba confirme folhas pequenas, opostas e brilhantes e caule fino de casca lisa.';
 const r=aiParse((await aiRetry(()=>sm(q,{cache:false,modelTier:"default",images:[dataBlob(foto)]}))).text);return{ai:1,id:PL.some(p=>p.id==r.id)?r.id:null,conf:r.confianca,m:r.descricao}}catch(e){return{ai:0}}}
async function idSend(){const u=U(),t=tmp.idf,E=m=>{$("#ie").textContent=m;$("#is").disabled=false;$("#is").textContent="Identificar"};if(!t.foto)return E("Escolha uma foto (câmera ou galeria).");
 const h=fh(t.foto);if(u.shots.some(x=>x.h==h)||Object.values(u.coll).some(c=>c.h==h))return E("Esta foto já foi usada. Tire uma foto nova da planta.");
 $("#is").disabled=true;$("#is").textContent="Identificando…";const r=await jvID(t.foto);

 if(!r.ai||!r.id||r.conf=="baixa"){t.manual=1;t.msg=(r.ai?"Não consegui identificar com segurança"+(r.m?" (vi: "+r.m+")":"")+".":"A IA não está disponível agora.")+" Escolha a planta que você recebeu na escola:";return idUI()}
 idAdd(r.id,"IA",r.conf)}
function idAdd(id,how,conf){const u=U(),p=PLI(id),t=tmp.idf;if(!p)return toast("Planta desconhecida.");if(locked(u,p)){t.manual=0;t.msg="Esta planta precisa ser desbloqueada pelo QR Code antes de receber fotos.";return idUI()}if(!t?.foto)return toast("Escolha uma foto.");const previous={...u.coll[id]};u.coll[id]={...previous,foto:t.foto,h:fh(t.foto),identifiedAt:Date.now(),identificationHow:how};if(!save()){u.coll[id]=previous;return toast("Armazenamento cheio.")}closeM();render();toast("Foto adicionada: "+p.nome);infoPlant(id)}
function perfilPlantas(u){return `<div class="card"><div class="grid"><div class="stat"><b>${PL.filter(p=>!locked(u,p)).length}/${PL.length}</b>plantas desbloqueadas por QR</div><div class="stat"><b>${u.shots.filter(s=>!locked(u,PLI(s.plant))).length}</b>fotos enviadas</div></div><p class="mu">Cada QR desbloqueia somente a planta correspondente.</p></div>`}
const topo=(t)=>{const u=U();return `<div class="row" style="margin-bottom:6px"><h2 style="flex:1">${t}</h2><button class="sec" aria-label="Abrir meu perfil" onclick="go('profile')" style="flex:none;width:52px;height:52px;border-radius:50%;border:2px solid var(--li);background:none;padding:0;cursor:pointer">${av(u,46)}</button></div>`};

function resumoHome(u){const S=stats(u),rw=CFG.recompensas.filter(r=>saldo(u)>=r.custo).length,hn=hojeN(u);

 <h3>Recompensas disponíveis</h3><div class="mu">${rw?`🎁 ${rw} recompensa(s) para resgatar com pontos`:"Nenhuma recompensa para resgatar agora"}</div>

 <div class="row"><button class="btn sec" onclick="go('catalog')">Catálogo</button><button class="btn sec" onclick="go('coll')">Coleção</button><button class="btn sec" onclick="jt(0);go('jour')">Jornada</button></div>
 <div class="row"><button class="btn sec sm" onclick="go('assist')">🤖 Green AI</button><button class="btn sec sm" onclick="go('rank')">🏆 Ranking</button><button class="btn sec sm" onclick="go('profile')">🪐 Perfil</button></div>`}
