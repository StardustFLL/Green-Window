<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia técnica dos cabelos</title>
<style>body{margin:24px;background:#180f27;color:#fff;font:15px system-ui}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.card{background:#2a1b3d;padding:15px;border:1px solid #73558f;border-radius:18px;text-align:center}.faces{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:8px}h1{font-size:24px}.mu{color:#d8c3ed}</style>
<h1>Prévia técnica — 16 cabelos</h1><p class="mu">Renderização real do avatar em três formatos de rosto. Esta página não cria contas, não altera dados e não conecta ao Firestore.</p><div class="grid" id="grid"></div>
<script src="../../avatar-hair.js"></script>
<script>
(async()=>{
  const grid=document.querySelector('#grid');
  if(!['localhost','127.0.0.1'].includes(location.hostname)){grid.textContent='Prévia disponível somente no servidor local de testes.';return}
  try{
    const source=await (await fetch('../../index.html',{cache:'no-cache'})).text();
    const start=source.indexOf('const getAv='),end=source.indexOf('async function resetDemo',start);
    if(start<0||end<0)throw new Error('Renderizador não encontrado.');
    const api=new Function(source.slice(start,end)+';return {avSvg,getAv};')();
    grid.innerHTML=window.JV_AVATAR_HAIR.styles.map((name,hair)=>name?`<div class="card"><strong>${hair+1}. ${name}</strong>${api.avSvg({...api.getAv({}),hair,face:0},130)}<div class="faces">${[1,2].map(face=>api.avSvg({...api.getAv({}),hair,face,hc:face===1?'#c9a14a':'#1c1410'},70)).join('')}</div></div>`:'').join('');
  }catch(e){grid.textContent='Não foi possível preparar a prévia: '+e.message}
})();
</script></html>
