.auth-card input[aria-invalid="true"],.auth-card select[aria-invalid="true"]{border-color:#ff7a9a}
.auth-card .auth-submit{margin-top:20px}
@media(max-width:400px){.auth-card{padding:16px}.auth-password button{min-width:74px;padding-inline:8px}.auth-progress li{font-size:.78rem}.auth-actions{gap:8px}}
.site-policy-links {
  display: flex;
  flex-wrap: wrap;
  gap: .4rem 1rem;
  margin-block: .5rem .8rem;
}
.site-policy-links a {
  color: #f0daff;
  font-weight: 700;
  text-decoration: underline;
  text-underline-offset: .2em;
}
.auth-agreements {
  border: 1px solid var(--li);
  border-radius: 14px;
  margin: 1rem 0;
  padding: .55rem .8rem .8rem;
  min-inline-size: 0;
}
.auth-agreements legend { padding-inline: .3rem; font-weight: 700; }
.auth-agreements .chk { margin-block: .55rem; }
.site-policy-dialog {
  color: var(--tx, #fff);
  background: #30204d;
  border: 1px solid var(--li, #aa86d7);
  border-radius: 18px;
  width: min(660px, calc(100% - 24px));
  max-width: none;
  max-height: calc(100dvh - 32px);
  overflow: hidden;
  padding: 0;
}
.site-policy-dialog[open] { display: flex; flex-direction: column; }
.site-policy-dialog::backdrop { background: rgb(13 8 25 / .75); }
.site-policy-header, .site-policy-footer { padding: 1rem 1.15rem; }
.site-policy-header h2 { margin: 0; overflow-wrap: anywhere; }
.site-policy-footer { border-top: 1px solid var(--li); margin: 0; }
.site-policy-footer .btn { width: 100%; margin: 0; }
.site-policy-content {
  overscroll-behavior: contain;
  overflow-y: auto;
  padding: .25rem 1.15rem .9rem;
  line-height: 1.55;
}
.site-policy-content h3 { margin: .75rem 0 .3rem; }
.site-policy-content p { margin: 0 0 .7rem; }

      if (step.type === 'google_search_call') for (const query of step.arguments?.queries || []) if (typeof query === 'string' && query.trim()) queries.add(clean(query, 400));
      if (step.type === 'google_search_result') for (const result of step.result || []) searchEntryPoint ||= clean(result.search_suggestions, 40000);
      for (const block of step.content || []) for (const annotation of block.annotations || [])
        if (annotation.type === 'url_citation') source(annotation.url, annotation.title);
    }
    const text = clean(typeof response?.text === 'function' ? response.text() : response?.text, 10000);
    if (!text || !sources.size || !queries.size) {
      const error = new Error('O Google não confirmou consultas e fontes nesta resposta.'); error.code = 'search-unverified'; throw error;
    }
    return { text, sources: [...sources.values()].slice(0, 12), queries: [...queries].slice(0, 10), searchEntryPoint, searched: true };
  }
  function failure(error) {
    if(error?.code==='preview-offline')return{code:error.code,message:'Nesta prévia, a conversa fica no seu navegador. As respostas da Green AI estão disponíveis no Janela Verde publicado.'};
    if(error?.code==='generation-unverified')return{code:error.code,message:'A resposta gerada não passou na conferência das fontes. Tente reformular a pergunta.'};
    if(error?.code==='generation-unavailable')return{code:error.code,message:'Não consegui gerar uma resposta agora. Tente novamente ou ative a IA local em um aparelho compatível.'};
    const detail = String(error?.code || '') + ' ' + String(error?.message || '');
    if (/429|quota|resource-exhausted|rate.limit/i.test(detail)) return { code: 'search-rate-limit', message: 'A fonte de pesquisa está temporariamente ocupada. Aguarde um pouco e tente novamente.' };
    if (/timeout|timed.out|abort/i.test(detail)) return { code: 'search-timeout', message: 'A pesquisa demorou além do esperado. Tente novamente em instantes.' };
    if (error?.code === 'search-empty') return { code:'search-empty', message:'Não encontrei uma fonte botânica suficiente para esta pergunta. Informe o nome da planta e o que deseja saber.' };
    if (error?.code === 'search-unverified') return { code: 'search-unverified', message: 'Não foi possível confirmar uma pesquisa com fontes. Tente novamente.' };
    return { code: 'search-unavailable', message: 'Não foi possível consultar as fontes abertas agora. Verifique a conexão e tente novamente.' };
  }
  const api = Object.freeze({ prepare, grounded, failure, queryPlan, analyze, lookup, validateGenerated, isGardeningQuestion, isScopeRefusalResult, scopeInstruction, scopeRefusal });
  if (typeof module === 'object' && module.exports) module.exports = api;
  else window.JV_GREEN_SEARCH = api;
})();

<script>
/* QR único inicia o cultivo. A espécie só é descoberta por flores confirmadas pela IA. QRs antigos continuam aceitos. */
(function () {
  'use strict';
  let memoryPending = null, busy = false, failedKey = '';
  const links = () => window.JV_QR_LINKS;
  const findPlant = id => PL.find(p => p.projectPlantId === id);
  function locked(user, plant) {
    const entry = user?.coll?.[plant?.id];
    return !plant || entry?.projectPlantId !== plant.projectPlantId || (entry?.qrUnlocked !== true && !discovered(user, plant));
  }
  function discovered(user, plant) {
    const entry = user?.coll?.[plant?.id];
    return !!plant && entry?.projectPlantId === plant.projectPlantId && entry?.bloomConfirmed === true && entry.bloomSpecies === plant.id
      && entry.bloomConfidence === 'alta' && !!entry.bloomPhotoId;
  }
  function grant(row, account = DB.session) {
    const user = U(), plant = findPlant(row?.plantId);
    if (!user || DB.session !== account || !plant || !links().validId(row.plantId) || row.active !== true || row.code !== links().code(row.plantId)) return null;
    if (!locked(user, plant)) return plant;
    const previous = user.coll[plant.id], previousGoals = user.pg[plant.id];
    user.coll[plant.id] = { ...previous, ts: previous?.ts || Date.now(), src: 'qr', how: 'QR Code',
      qrUnlocked: true, projectPlantId: row.plantId, qrCode: row.code, unlockedAt: Date.now() };
    user.pg[plant.id] = previousGoals || {};
    if (!save()) {
      if (previous) user.coll[plant.id] = previous; else delete user.coll[plant.id];
      if (previousGoals) user.pg[plant.id] = previousGoals; else delete user.pg[plant.id];
      return null;
    }
    return plant;
  }
  function scan(expectedId) {
    if (!U()) return go('login');
    const account = DB.session;
    scanCam('Escaneie o QR do Janela Verde', async raw => {
      if (links().isUniversal?.(raw)) return { universal: true };
      const api = await claude.use('qr-codes');
      if (!api) throw new Error('Serviço de QR indisponível.');
      const row = await api.lookup(raw);
      if (!row || (expectedId && row.plantId !== expectedId)) return null;
      return api.scan(raw);
    }, (_, row) => {
      if (row?.universal) { $('#modal').innerHTML = ''; toast('Janela Verde aberto. Registre seu cultivo e descubra a espécie quando florescer.'); return go('coll'); }
      const plant = grant(row, account);
      if (!plant) return toast('Não consegui salvar o desbloqueio. Confira sua conta e o espaço do aparelho.');
      recordVaseScan(row); $('#modal').innerHTML = ''; go('catalog'); infoPlant(plant.id);
      toast('Cultivo liberado! A espécie será revelada quando uma foto confirmar o florescimento.');
    }, () => { $('#modal').innerHTML = ''; });
  }
  function pending() { return memoryPending || links().pending(); }
  function capture() {
    const url = new URL(location.href);
    if (!url.searchParams.has('planta')) return;
    const id = links().entry(url);
    if (!id) {
      memoryPending = null;
      try { links().clear(); } catch (_) {}
      tmp.pendingUnlockError = 'Este QR de planta está inválido ou desativado.'; return;
    }
    memoryPending = id;
    try { links().remember(id); } catch (_) { /* A consulta da URL continua disponível nesta sessão. */ }
  }
  function clear(id) {
    if (pending() !== id) return;
    memoryPending = null;
    try { links().clear(); } catch (_) {}
    const url = new URL(location.href);
    if (links().entry(url) === id) { url.searchParams.delete('planta'); history.replaceState(history.state, '', url); }
  }
  function banner() {
    const id = pending();
    if (!id && !tmp.pendingUnlockError) return '';
    const message = tmp.pendingUnlockError || ('QR antigo de cultivo recebido. ' + (U() ? 'Vamos conferir o acesso; a espécie continua oculta até a foto das flores.' : 'Entre ou crie sua conta para acompanhar o cultivo.'));
    return '<div class="card" role="status"><p id="pending-plant-message">' + esc(message) + '</p>' +
      (tmp.pendingUnlockError && id && U() ? '<button class="btn sec" onclick="window.JV_UNLOCKS.retry()">Tentar validar novamente</button>' : '') + '</div>';
  }
  async function process() {
    const id = pending(), user = U(), account = DB.session;
    if (!id || !user || busy || failedKey === account + '/' + id) return;
    const plant = findPlant(id);
    if (!plant) return;
    if (!locked(user, plant)) { clear(id); tmp.pendingUnlockError = ''; render(); return; }
    busy = true;
    try {
      const api = await claude.use('qr-codes');
      const row = api && await api.scan(links().code(id));
      if (DB.session !== account) return;
      if (!row) throw new Error('QR não cadastrado ou desativado.');
      if (!grant(row, account)) throw new Error('Não foi possível salvar o desbloqueio neste aparelho.');
      recordVaseScan(row); clear(id); tmp.pendingUnlockError = ''; failedKey = '';
      toast('Cultivo liberado! Fotografe as flores para descobrir a espécie no catálogo.');
    } catch (_) {
      if (DB.session === account) {
        failedKey = account + '/' + id;
        tmp.pendingUnlockError = 'Não consegui validar o QR. Confira a internet e se o código está ativo; a planta continua bloqueada.';
      }
    } finally { busy = false; render(); }
  }
  window.JV_UNLOCKS = Object.freeze({ locked, discovered, grant, scan, capture, banner, process,
    retry() { failedKey = ''; tmp.pendingUnlockError = ''; return process(); } });
})();

</script>

<script>
/* Reconstrução dos dados: imagens ficam em photos; o perfil guarda seus metadados. */
(function () {
  const unique = rows => [...new Map((Array.isArray(rows) ? rows : []).filter(row => row?.id).map(row => [row.id, row])).values()];
  const retiredIds = new Set(['capim', 'planta-5', 'janelaverde:planta-5']);
  const normalized = value => String(value ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  const retired = value => retiredIds.has(normalized(value)) || /^(?:capim[\s-]+limao|cymbopogon citratus)$/.test(normalized(value));
  const retiredCredit = row => /^(?:descoberta|planta|meta):capim(?::|$)/.test(row?.key || '')
    || /^(?:descoberta_capim|c\d+capim)$/.test(row?.id || '');

  function removeRetiredPlant(profile) {
    if (!profile || typeof profile !== 'object') return false;
    const matches = row => typeof row === 'string' ? retired(row) :
      ['id', 'plant', 'plantId', 'plantName', 'projectPlantId', 'vaseId', 'vaseName', 'nome', 'especie',
        'bloomSpecies', 'identifiedAs', 'qrCode', 'code', 'token'].some(field => retired(row?.[field]));
    const plants = Array.isArray(profile.plants) ? profile.plants : [];
    const cropIds = new Set(plants.filter(matches).map(plant => plant.id).filter(Boolean));
    const linked = row => matches(row) || cropIds.has(row?.plant) || cropIds.has(row?.vaseId);
    let changed = false;
    function filter(target, field, remove) {
      if (!Array.isArray(target?.[field])) return;
      const kept = target[field].filter(row => !remove(row));
      if (kept.length !== target[field].length) { target[field] = kept; changed = true; }
    }
    for (const field of ['plants', 'regs', 'shots', 'sched', 'qr']) filter(profile, field, linked);
    filter(profile, 'pts', retiredCredit);
    for (const field of ['coll', 'pg', 'pc']) {
      for (const [key, row] of Object.entries(profile[field] || {})) {
        if (retired(key) || (field === 'coll' && linked(row))) { delete profile[field][key]; changed = true; }
      }
    }
    const journal = profile.schoolSync;
    filter(journal, 'events', event => ['planta_desbloqueada', 'planta_concluida', 'foto_publicada',
      'florescimento_confirmado'].includes(event?.type) && retired(String(event.detail || '').replace(/^Espécie descoberta pela foto das flores:\s*/i, '')));
    if (retired(profile.active) || cropIds.has(profile.active)) {
      profile.active = profile.plants?.[0]?.id || '';
      changed = true;
    }
    if (cropIds.size && (profile.id === 'basic' || profile.accountId === 'basic') && !profile.plants.length && profile.end) {
      // Mantém a conta pronta para um novo cultivo, sem vincular a espécie retirada.
      const inicio = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
      profile.plants.push({ id: 'cultivo_padrao', nome: 'Minha planta', especie: '', inicio,
        local: profile.end, localCultivo: profile.localCultivo || null, foto: '', obs: '' });
    }
    return changed;
  }

  function ledger(previous, incoming) {
    const rows = Array.isArray(previous) ? previous.filter(row => !retiredCredit(row)) : [];
    const identity = row => row.key || (/^Registro do dia \d{4}-\d{2}-\d{2}$/.test(row.why || '') ? 'dia:' + row.why.slice(16) : row.id) || String(row.ts) + ':' + row.why + ':' + row.v;
    const seen = new Set(rows.map(identity));
    for (const row of Array.isArray(incoming) ? incoming : []) {
      if (retiredCredit(row)) continue;
      if (!Number.isSafeInteger(row?.v) || !Number.isFinite(row?.ts) || row.ts <= 0) throw new Error('Lançamento de pontos inválido.');
      const id = identity(row); if (!seen.has(id)) { rows.push(row); seen.add(id); }
    }
    return rows;
  }
  function hydrate(profile, photos, messages) {
    const result = JSON.parse(JSON.stringify(profile));
    const rows = unique(photos);
    result.regs = rows.filter(row => row.id.startsWith('reg_')).map(row => ({ ...row, id: row.id.slice(4) }));
    result.shots = (result.shots || []).map(row => ({ ...row }));
    result.coll ||= {}; result.plants ||= [];
    rows.forEach(row => {
      if (row.id.startsWith('shot_')) {
        const id = row.id.slice(5), index = result.shots.findIndex(item => item.id === id), shot = { ...(result.shots[index] || {}), ...row, id };
        if (index < 0) result.shots.push(shot); else result.shots[index] = shot;
      }
      for (const [id, plant] of Object.entries(result.coll)) if (row.id.startsWith('coll_' + id + '_')) Object.assign(plant, { foto: row.foto || row.th || '', th: row.th || '' });
      result.plants.forEach(plant => { if (row.id === 'plant_' + plant.id) Object.assign(plant, { foto: row.foto || row.th || '', th: row.th || '' }); });
    });
    result.chatHistory = unique(messages).sort((a, b) => a.ts - b.ts || a.id.localeCompare(b.id));
    if (result.cloudConsent === undefined) result.cloudConsent = !!result.schoolNoticeAt;
    result.av = typeof result.avatar === 'object' && result.avatar ? result.avatar : result.av || {};
    removeRetiredPlant(result);
    return result;
  }
  window.JV_SCHOOL_DATA = Object.freeze({ hydrate, ledger, removeRetiredPlant });
})();

</script>

<script>
/* Painel escolar. O acesso depende da senha do site e da autorização UID no Firebase. */
(function () {
  'use strict';
  const states = new WeakMap(), live = new Set(), PAGE = 50, ONLINE_TTL = 90000;
  let observer;
  const list = value => Array.isArray(value) ? value : [];
  const entries = value => value && typeof value === 'object' ? Object.entries(value) : [];
  const text = value => value == null || value === '' ? '—' : String(value);
  const number = value => Number.isFinite(Number(value)) ? Number(value) : 0;
  const key = row => String(row?.key || row?.id || '');
  const formatCount = new Intl.NumberFormat('pt-BR');
  function millis(value) {
    if (typeof value?.toMillis === 'function') return value.toMillis();
    if (typeof value?.seconds === 'number') return value.seconds * 1000;
    return number(value);
  }
  function time(value) {
    const ts = millis(value); return ts > 0 ? new Date(ts).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' }) : 'Aguardando sincronização';
  }
  function dateKey(value) {
    const date = new Date(millis(value));
    return Number.isFinite(date.getTime()) ? new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(date) : '';
  }
  function streak(photoDays, now = Date.now()) {
    const days = [...new Set(list(photoDays).filter(day => { if (!/^\d{4}-\d{2}-\d{2}$/.test(day)) return false;
      const date = new Date(day + 'T12:00:00Z'); return Number.isFinite(date.getTime()) && date.toISOString().slice(0, 10) === day; }))].sort();
    let best = 0, run = 0, previous = 0;
    days.forEach(day => { const ts = Date.parse(day + 'T12:00:00Z'); run = ts - previous === 86400000 ? run + 1 : 1; previous = ts; best = Math.max(best, run); });
    let current = 0;
    if (days.length && [dateKey(now), dateKey(now - 86400000)].includes(days[days.length - 1])) {
      current = 1;
      for (let i = days.length - 1; i > 0 && Date.parse(days[i] + 'T12:00:00Z') - Date.parse(days[i - 1] + 'T12:00:00Z') === 86400000; i--) current++;
    }
    return { current, best, total: days.length };
  }
  function metrics(row) {
    if (row?._ranking) {
      const data = row._ranking, sequence = streak(data.days);
      return { photos: data.photos, questions: data.questions, current: sequence.current, best: sequence.best, totalDays: sequence.total };
    }
    const stats = row?.stats || {}, sequence = streak(row?.photoDays);
    return { photos: Math.max(0, number(stats.photoCount)), questions: Math.max(0, number(stats.aiQuestions)),
      current: Array.isArray(row?.photoDays) ? sequence.current : Math.max(0, number(stats.currentStreak)),
      best: Math.max(sequence.best, number(stats.bestStreak)), totalDays: Math.max(sequence.total, number(stats.totalDays)) };
  }
  function rankings(rows, metric) {
    return list(rows).slice().sort((a, b) => Number(b._rankingReady !== false) - Number(a._rankingReady !== false)
      || metrics(b)[metric] - metrics(a)[metric] || text(a.nome).localeCompare(text(b.nome), 'pt-BR') || key(a).localeCompare(key(b)));
  }
  function activityMetrics(activity) {
    const photos = [...new Map(list(activity?.photos).filter(item => item?.id).map(item => [item.id, item])).values()];
    const questions = Number.isSafeInteger(activity?.questionCount) && activity.questionCount >= 0
      ? activity.questionCount : new Set(list(activity?.questions).filter(item => item?.id && item.role === 'user').map(item => item.id)).size;
    const days = [...new Set(photos.filter(item => (item.id.startsWith('reg_') || item.kind === 'registro')
      && !/^(shot_|coll_|plant_)/.test(item.id) && millis(item.ts) > 0 && millis(item.ts) <= Date.now())
      .map(item => dateKey(item.ts)).filter(Boolean))];
    return { photos: photos.length, questions, days };

<script>
/* Mascote vetorial da ofensiva. A sequência continua baseada em dias com registro. */
(function () {
  'use strict';
  const HOUR = 3600000;
  let stopCurrent = () => {};
  const localDay = timestamp => new Intl.DateTimeFormat('en-CA', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(timestamp));
  function model(user, count, now = Date.now(), dayKey = localDay) {
    const records = (user?.regs || []).map(record => Number(record.ts)).filter(ts => Number.isFinite(ts) && ts > 0 && ts <= now);
    const last = records.length ? Math.max(...records) : null;
    const days = Math.max(0, Math.floor(Number(count) || 0));
    if (!last) return { state: 'idle', count: 0, title: 'Uma nova jornada', message: 'Faça seu primeiro registro e veja sua plantinha florescer.', remaining: null };
    const [year, month, date] = dayKey(last).split('-').map(Number);
    // A ofensiva aceita o registro de hoje ou ontem; quebra à meia-noite após o dia perdido.
    const deadline = new Date(year, month - 1, date + 2).getTime();
    const remaining = Math.max(0, deadline - now), age = now - last, doneToday = dayKey(last) === dayKey(now);
    if (!days || !remaining) return { state: 'broken', count: 0, title: 'Vamos recomeçar?', message: 'Sua sequência terminou, mas sua próxima jornada pode começar hoje.', remaining: 0 };
    if (remaining <= 50 * 60000) return { state: 'critical', count: days, title: 'Sua planta precisa de você!', message: 'Registre um cuidado antes de virar o dia para manter sua ofensiva.', remaining, deadline };
    if (age >= 12 * HOUR) return { state: 'wilting', count: days, title: 'Sua plantinha sente saudade', message: doneToday ? 'O cuidado de hoje já está registrado. Sua ofensiva continua!' : 'Sua sequência está viva. Registre o cuidado de hoje para continuar.', remaining, deadline };
    return { state: 'healthy', count: days, title: 'Cuidado em dia!', message: doneToday ? 'Você cuidou hoje. Sua plantinha está brilhando!' : 'Sua plantinha está saudável. Continue cuidando dela hoje.', remaining, deadline };
  }
  function plant(state) {
    const healthy = state === 'healthy', tired = state === 'wilting', dark = state === 'critical' || state === 'broken';
    const leaf = dark ? '#63705d' : tired ? '#91b768' : '#66c879', light = dark ? '#819279' : tired ? '#b5ce81' : '#a2e990';
    const stem = dark ? '#586c53' : '#4d8c59', pot = dark ? '#887480' : '#dba2a2';
    const foliage = healthy || state === 'idle'
      ? `<path d="M80 100C77 78 83 62 81 43"/><path d="M80 76C58 78 38 65 40 46C60 43 78 55 80 76Z" fill="${leaf}"/><path d="M81 65C81 43 98 29 116 34C118 51 104 69 81 65Z" fill="${light}"/><path d="M81 48C67 42 64 27 73 19C87 23 92 36 81 48Z" fill="${leaf}"/>`
      : tired
        ? `<path d="M80 100C83 78 75 61 65 56"/><path d="M77 76C60 57 41 58 34 74C47 87 66 86 77 76Z" fill="${leaf}"/><path d="M75 64C88 48 109 51 117 73C102 79 83 76 75 64Z" fill="${light}"/><path d="M66 57C53 59 45 47 49 37C64 37 72 44 66 57Z" fill="${leaf}"/>`
        : `<path d="M80 100C88 79 73 62 58 65"/><path d="M76 79C58 62 39 72 39 94C58 97 70 91 76 79Z" fill="${leaf}"/><path d="M76 72C95 63 110 77 106 100C89 98 78 89 76 72Z" fill="${light}"/><path d="M60 65C45 73 36 61 39 50C51 45 64 51 60 65Z" fill="${leaf}"/>`;
    const face = dark ? '<path d="M65 116l7 3m0-3-7 3m23-3 7 3m0-3-7 3M74 130q6-6 12 0"/>'
      : tired ? '<path d="M65 117q4 4 8 0m14 0q4 4 8 0M75 129h10"/>'
        : '<path d="M65 118q4-6 8 0m14 0q4-6 8 0M74 126q6 8 12 0"/>';
    return `<svg class="sp-plant" viewBox="0 0 160 160" aria-hidden="true" focusable="false"><circle cx="80" cy="80" r="74" fill="${dark ? '#30263f' : '#bba5dd'}"/><circle cx="65" cy="58" r="54" fill="#fff" opacity="${dark ? '.03' : '.12'}"/><ellipse cx="80" cy="143" rx="42" ry="7" fill="#20132f" opacity=".16"/><g class="sp-foliage" stroke="${stem}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">${foliage}</g><path d="M52 102h56l-6 30c-2 12-42 12-44 0Z" fill="${pot}"/><path d="M93 106h14l-5 26c-1 7-8 10-17 11l6-13Z" fill="#503654" opacity=".16"/><rect x="48" y="96" width="64" height="14" rx="7" fill="${dark ? '#a18a99' : '#edbab4'}"/><path d="M56 100h36" stroke="#fff" stroke-width="3" opacity=".3" stroke-linecap="round"/><g stroke="${dark ? '#352b3c' : '#4d344b'}" stroke-width="2.8" stroke-linecap="round" fill="none">${face}</g>${!dark ? '<ellipse cx="62" cy="125" rx="4" ry="2" fill="#c8758d" opacity=".5"/><ellipse cx="98" cy="125" rx="4" ry="2" fill="#c8758d" opacity=".5"/>' : ''}${healthy ? '<g class="sp-sparkles" fill="#fff3bd"><path d="m126 23 3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/><path d="m29 84 2 6 6 2-6 2-2 6-2-6-6-2 6-2Z"/><circle cx="123" cy="97" r="3"/><circle cx="38" cy="28" r="2"/></g>' : ''}</svg>`;
  }
  function html(user, count, now, dayKey) {
    const data = model(user, count, now, dayKey);
    const minutes = data.remaining === null ? 0 : Math.ceil(data.remaining / 60000);
    const clock = data.state === 'critical' ? `Faltam ${minutes} min para a sequência terminar` : '';
    return `<section class="streak-hero sp-${data.state}" aria-label="Sua ofensiva: ${data.count} ${data.count === 1 ? 'dia' : 'dias'} seguidos"><div class="sp-top"><span class="sp-eyebrow">UM CUIDADO POR DIA</span><span class="sp-chip">${data.state === 'healthy' ? '✦ Em dia' : data.state === 'critical' ? 'Últimos minutos' : data.state === 'wilting' ? 'Hora de cuidar' : 'Sua ofensiva'}</span></div><div class="sp-main"><div class="sp-total"><span class="sp-number">${data.count}</span><span class="sp-days">${data.count === 1 ? 'dia seguido' : 'dias seguidos'}</span></div>${plant(data.state)}</div><div class="sp-copy"><h3>${data.title}</h3><p>${data.message}</p>${clock ? `<p class="sp-countdown" role="timer" aria-live="off">${clock}</p>` : ''}</div><button type="button" class="btn sp-action" onclick="openReg()">${data.state === 'healthy' ? 'Registrar outro cuidado' : 'Cuidar da minha planta'} <span aria-hidden="true">↗</span></button></section>`;
  }
  function mount(container, options) {
    stopCurrent(); if (!container) return;
    let previous = '';
    const update = () => {
      if (container.isConnected === false) { stopCurrent(); return; }
      const user = options.getUser(); if (!user) return;
      const markup = html(user, options.getCount(user), Date.now(), options.dayKey);
      if (markup !== previous) { container.innerHTML = markup; previous = markup; }
    };
    const onVisible = () => { if (document.visibilityState !== 'hidden') update(); };
    const interval = setInterval(onVisible, 30000);
    document.addEventListener('visibilitychange', onVisible);
    stopCurrent = () => { clearInterval(interval); document.removeEventListener('visibilitychange', onVisible); stopCurrent = () => {}; };
    update();
  }
  window.JV_STREAK_PLANT = Object.freeze({ model, html, mount, stop: () => stopCurrent() });
})();

</script>

function routeFor(screen, tab) {
  if (screen === 'plants') screen = 'coll';
  if (!Object.hasOwn(V, screen)) screen = 'splash';
  const user = U();
  if (!user && (appScreens.includes(screen) || ['schoolNotice', 'verifyEmail', 'perm', 'intro3'].includes(screen))) screen = 'splash';
  if (user && ['splash', 'signup', 'login'].includes(screen)) screen = 'home';
  if (user && !user.schoolNoticeAt && !['admin', 'schoolNotice'].includes(screen)) {
    tmp.afterNotice = screen;
    screen = 'schoolNotice';
  }
  if (screen === 'jour') tab = journeyTabs.includes(tab) ? tab : journeyTabs[0];
  else if (screen === 'admin') tab = tmp.admok && adminTabs.includes(tab) ? tab : adminTabs[0];
  else tab = '';
  return { screen, tab };
}

function showRoute(requested, { replace = false, restoring = false } = {}) {
  const previous = activeRoute, next = routeFor(requested.screen, requested.tab);
  const same = previous?.screen === next.screen && previous.tab === next.tab;
  if (previous) pageScroll.set(activeDepth, window.scrollY);
  if (previous?.screen === 'assist' && next.screen !== 'assist') resetAiChat();
  if (previous && (!same || restoring)) {
    clearInterval(tmp.qt);
    tmp.qs?.getTracks().forEach(track => track.stop());
    tmp.qs = null;
    $('#modal').textContent = '';
  }

  const savedDepth = history.state?.janelaVerde?.depth;
  if (restoring || !previous) activeDepth = Number.isSafeInteger(savedDepth) && savedDepth >= 0 ? savedDepth : 0;
  else if (!same && !replace) {
    activeDepth++;
    for (const depth of pageScroll.keys()) if (depth >= activeDepth) pageScroll.delete(depth);
  }
  const url = new URL(location.href);
  url.searchParams.delete('admin');
  url.searchParams.set('tela', next.screen);
  if (next.tab) url.searchParams.set('aba', next.tab);
  else url.searchParams.delete('aba');
  const state = { ...history.state, janelaVerde: { depth: activeDepth } };
  if (!previous || restoring || replace) history.replaceState(state, '', url);
  else if (!same) history.pushState(state, '', url);

  activeRoute = next;
  view = next.screen;
  if (view === 'jour') tmp.jt = journeyTabs.indexOf(next.tab);
  const existingAdmin = view === 'admin' && previous?.screen === 'admin' && $('#school-admin');
  if (existingAdmin) window.JV_SCHOOL_ADMIN?.showTab(existingAdmin, next.tab);
  else render();
  window.scrollTo(0, restoring ? pageScroll.get(activeDepth) || 0 : 0);
}

function routeFromLocation() {
  const params = new URL(location.href).searchParams;
  return { screen: params.get('tela') || (params.get('admin') === '1' ? 'admin' : 'splash'), tab: params.get('aba') };
}

function go(screen, options) {
  showRoute({ screen, tab: screen === 'jour' ? journeyTabs[tmp.jt || 0] : '' }, options);
}

function goBack(fallback) {
  if (activeDepth > 0) history.back();
  else go(fallback);
}

async function ask(t){
 const u=U(),q=(t||$("#q")?.value||'').trim();if(!u||!q||tmp.aiBusy)return;if(q.length>1600)return toast('Use até 1600 caracteres.');

 const allowed=scope.isGardeningQuestion(q,hist),message={id,role:'user',content:q,ts:Date.now(),...(allowed?{}:{status:'scope-refused'})};
 u.chatHistory=u.chatHistory||[];u.chatHistory.push(message);
 if(!save()){u.chatHistory.pop();return}window.JV_SCHOOL_SYNC?.record(u,'green_ai_pergunta','Pergunta enviada à Green AI.');session.ids.push(id);tmp.aiBusy=allowed;tmp.aiRequest=id;const input=$('#q');if(input)input.value='';
 const add=(text,extra={})=>{session.ids.push(id+'_answer');u.chatHistory.push({id:id+'_answer',role:'assistant',content:text,ts:Date.now(),...extra});try{localStorage.setItem(LS,JSON.stringify(DB));window.JV_SCHOOL_SYNC?.observe(u)}catch(_){toast('Não foi possível salvar a resposta neste aparelho.')}if(tmp.aiSession===session&&tmp.aiRequest===id){tmp.aiBusy=false;if(U()?.id===u.id&&view==='assist')refreshAiChat()}};
 const refuse=()=>{const result=scope.scopeRefusal();message.status='scope-refused';add(result.text,{status:message.status,answerMode:result.answerMode,searched:false})};
 if(!allowed){refuse();return}
 refreshAiChat();
 try{
  const search=await claude.use('web-search');if(!search)throw new Error('Serviço de pesquisa indisponível.');
  const response=await search({question:q,history:hist,accountId:u.id,messageId:id});
  if(scope.isScopeRefusalResult(response)){refuse();return}
  const generated=response.generated===true&&['model','grounded'].includes(response.answerMode);
  if(!response.text||!generated&&(response.searched!==true||!safeSources(response.sources).length||!Array.isArray(response.queries)||!response.queries.some(query=>typeof query==='string'&&query.trim())))throw Object.assign(new Error('Não foi possível confirmar a resposta do modelo.'),{code:'generation-unverified'});
  add(response.text,{sources:safeSources(response.sources),searched:response.searched===true,searchEntryPoint:response.searchEntryPoint||'',queries:response.queries||[],provider:response.provider||'google',answerMode:response.answerMode||'summary',retrievedAt:response.retrievedAt||0,cached:response.cached===true})
 }catch(e){const failure=scope.failure(e);add(failure.message,{status:'error',searched:false,searchError:failure.code})}
}

/* Validação de endereço: 1) filtro local (lixo óbvio como "bla"), 2) IA confere cidade/estado e se a rua é plausível. Quem decide é o código; falha = recusa (não aprova por padrão). */
function addrLocal(rua){
 const raw=String(rua||"").trim(),s=raw.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
 const nome=s.replace(/\d+/g," ").replace(/[^a-z\s]/g," ").replace(/\s+/g," ").trim(),L=nome.replace(/\s/g,"");
 const lixo=/^(bla+|blabla\w*|bl[ae]h*|asd\w*|qwe\w*|teste\w*|test|xxx+|abc\w*|aaa+|bbb+|nada|nao sei|sei la|foo|bar|zzz+|lorem|ipsum|fulano|casa|rua|avenida|av|endereco|aqui|la|ali|x+|a+|ok|oi|kkk+|haha+|hehe+)$/;
 /* ruas com número ou letra no nome são comuns no Brasil (Rua 7, Rua A, Quadra 12, Av. 3): não são lixo */
 const desig=/\b(rua|r|avenida|av|alameda|travessa|tv|estrada|via|quadra|qd|conjunto|cj|beco|viela)\.?\s+([a-z]|\d{1,3}|um|dois|tres|quatro|cinco|seis|sete|oito|nove|dez)\b/.test(s);
 if(!desig&&(L.length<4||lixo.test(nome)||nome.split(" ").every(w=>lixo.test(w))||!/[aeiou]/.test(L)||/(.)\1{3,}/.test(L)||/^(.{1,3})\1{2,}$/.test(L)))return"Esse endereço não parece real. Informe o nome da rua e o número (ex.: Rua das Flores, 120).";
 if(!/\d/.test(s)&&!/\bs\s*\/?\s*n\b|sem numero/.test(s))return"Inclua o número (ou s/n se não tiver).";
 return""}

function pimg(p){let b="";const fan=(n,L,W,c,sp,st)=>{for(let i=0;i<n;i++){const a=-sp/2+sp*i/(n-1||1),t=`transform="rotate(${a} 100 136)"`;b+=`<ellipse cx="100" cy="${136-L/2}" rx="${W}" ry="${L/2}" fill="${c}" ${t}/>`+(st?`<ellipse cx="100" cy="${136-L/2}" rx="2.5" ry="${L/2-4}" fill="#e6efe6" ${t}/>`:"")}};
 const fl=(pts,c,r,m)=>pts.forEach(q=>b+=`<circle cx="${q[0]}" cy="${q[1]}" r="${r}" fill="${c}"/><circle cx="${q[0]}" cy="${q[1]}" r="${r/3}" fill="${m||"#ffd34d"}"/>`);

 else if(p.id=="lambari"){fan(9,72,10,"#6b3a8f",120);fan(6,52,9,"#8a54b0",90)}
 else if(p.id=="tradescantia"){fan(9,66,11,"#4a7a4a",130,1)}
 else if(p.id=="trapoeraba"){fan(9,58,9,"#5fae5f",140);fl([[58,86],[104,70],[142,90]],"#4a8fe7",8,"#fff")}
 else if(p.id=="manaca"){b+=`<path d="M97 136V84L78 67M99 106L122 80" fill="none" stroke="#785a44" stroke-width="9" stroke-linecap="round"/><ellipse cx="100" cy="65" rx="49" ry="39" fill="#4a8b58"/>`;fl([[72,65],[111,48]],"#fff2fc",12,"#9b68b1");fl([[98,79],[126,73]],"#e69ddb",12,"#794d9d")}
 else{b+=`<rect x="95" y="70" width="10" height="68" fill="#6b4a2f"/><circle cx="100" cy="58" r="30" fill="#3f8f4a"/><circle cx="76" cy="76" r="20" fill="#4aa055"/><circle cx="126" cy="74" r="21" fill="#4aa055"/>`;[[92,96],[108,108],[97,120],[106,88]].forEach(q=>b+=`<circle cx="${q[0]}" cy="${q[1]}" r="6" fill="#3a1a3f"/>`)}

 return "data:image/svg+xml,"+encodeURIComponent(s)}

function plantEquivalenceNote(user,p){return user?.coll?.[p?.id]?.identifiedAs==='dalia'?'<p class="mu">Reconhecida na foto: <b>Dália (Dahlia spp.)</b>. No projeto, a Dália Unwins Anã Dobrada conta como Onze-horas e compartilha sua ficha, metas e bônus. A variedade exata não pode ser garantida só pela foto.</p>':''}
function plantCare(p,user=U()){if(!p||user?.coll?.[p.id]?.identifiedAs!=='dalia')return p;return {...p,cient:'Dahlia spp.',luz:'Local ensolarado e protegido.',agua:'Mantenha o substrato levemente úmido, conferindo antes de regar; evite deixá-lo seco por longos períodos ou encharcado.',solo:'Solo fértil, com matéria orgânica e boa drenagem.',dica:'Retire flores murchas para favorecer novas florações.',atencao:'Estes cuidados são para a Dália reconhecida na foto. Ela ocupa a ficha Onze-horas por uma equivalência do projeto.',tox:{n:'Tóxica para cães e gatos',pele:'Evite contato da seiva com a pele e use luvas se tiver sensibilidade.',pets:'Pode causar desconforto gastrointestinal e irritação da pele em animais. Mantenha fora do alcance e procure um veterinário em caso de ingestão.'}}}
const mysteryPlant=()=> 'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" rx="24" fill="#3d245b"/><circle cx="100" cy="88" r="65" fill="#bda5d6"/><path d="M100 128V86M100 105C70 104 57 88 60 70C85 68 101 84 100 105M101 91C99 64 118 49 139 53C141 76 124 94 101 91" fill="#86c786" stroke="#4c8555" stroke-width="4"/><path d="M69 125h62l-9 43H78Z" fill="#dca6ab"/><rect x="63" y="121" width="74" height="14" rx="7" fill="#edbec3"/><text x="100" y="157" text-anchor="middle" font-size="25" font-family="sans-serif" fill="#543750">?</text></svg>');
function prog(u,pid,g){if((u.pg[pid]||{})[g.id])return g.b;const s=u.shots.filter(x=>x.plant==pid&&x.kind==g.id);
 if(g.id=="cresc")return Math.min(new Set(s.map(x=>day(x.ts))).size,g.b);
 if(g.id=="rega")return Math.min(u.sched.filter(x=>x.plant==pid&&x.tipo=="rega"&&x.done).length,g.b);
 return Math.min(s.length,g.b)}
function syncGoals(u){const msg=[];PL.filter(p=>!locked(u,p)).forEach(p=>{u.pg[p.id]=u.pg[p.id]||{};GM(p).forEach(g=>{if(!u.pg[p.id][g.id]&&prog(u,p.id,g)>=g.b){u.pg[p.id][g.id]=Date.now();u.pts.push({id:"m"+Date.now()+g.id,ts:Date.now(),v:CFG.pontosMeta,why:"Meta: "+g.t+" ("+plantLabel(p,u)+")",key:"meta:"+p.id+":"+g.id});msg.push("Meta concluída: "+g.t+" (+"+CFG.pontosMeta+" pts)")}});
 if(!u.pc[p.id]&&GM(p).every(g=>u.pg[p.id][g.id])){u.pc[p.id]=Date.now();u.pts.push({id:"c"+Date.now()+p.id,ts:Date.now(),v:CFG.pontosPlanta,why:"Todas as metas: "+plantLabel(p,u),key:"planta:"+p.id});msg.push(plantLabel(p,u)+" completa! +"+CFG.pontosPlanta+" pts")}});
return msg}
function stats(u){const ow=PL.filter(p=>!locked(u,p));let d=0,t=0;const pend=[];ow.forEach(p=>GM(p).forEach(g=>{t++;const a=prog(u,p.id,g);if(a>=g.b)d++;else pend.push({p,g,a})}));return{ow,d,t,pend}}

const hojeN=u=>u.sched.filter(x=>!locked(u,PLI(x.plant))&&!x.done&&x.data<=day(Date.now())).length;
/* --- Bonsai em casa --- */
const BONSAI={
  manaca:{
    care:"Prefira uma varanda ou um quintal bem iluminado. Acostume a muda ao sol aos poucos, começando pelo sol suave da manhã. Observe a umidade com frequência e deixe a água escorrer.",
    pruning:"Espere a floração terminar antes de encurtar ramos com botões ou flores. Faça podas leves para manter a copa compacta.",
    source:["Manacá-da-serra · Roteiro Botânico Andreense","https://portais.santoandre.sp.gov.br/roteirobotanicoandreense/2025/05/20/manaca-da-serra/"]
  },
  jabuticaba:{
    care:"Deixe a jabuticabeira em uma área externa bem iluminada. Mantenha o substrato levemente úmido e confira se a água sai pelos furos. Em dias quentes, confira a umidade mais de uma vez.",
    pruning:"Faça podas leves de formação e preserve os galhos principais. As flores e os frutos podem aparecer diretamente no tronco. A jabuticabeira é sensível ao transplante, então preserve o torrão ao trocar de vaso.",
    source:["Jabuticabeira · Embrapa","https://www.infoteca.cnptia.embrapa.br/bitstream/doc/744946/1/documento129.pdf"]
  }
};
function bonsaiButton(user,plant){
 return Object.hasOwn(BONSAI,plant.id)&&discovered(user,plant)?`<button class="btn sec" type="button" onclick="openBonsai('${plant.id}')">🌳 Guia de bonsai em casa</button>`:"";
}
function openBonsai(id){
 const plant=PLI(id),guide=Object.hasOwn(BONSAI,id)?BONSAI[id]:null;
 if(!guide||!discovered(U(),plant))return;
 $("#modal").innerHTML=`<div class="modal"><div class="bonsai-guide" role="dialog" aria-modal="true" aria-labelledby="bonsai-title">
  <h2 id="bonsai-title" tabindex="-1">Bonsai em casa</h2><p class="mu">${esc(plant.nome)}</p>
  <p>Um bonsai é uma árvore cultivada em vaso e formada aos poucos. Comece com uma muda saudável e faça uma mudança de cada vez.</p>
  <ol>
   <li><strong>Escolha a muda.</strong> Use uma muda saudável de viveiro ou uma que você já esteja cultivando. Dê tempo para ela se adaptar ao local.</li>
   <li><strong>Prepare um vaso de treino.</strong> Use um recipiente com furos e um substrato que retenha umidade e deixe o excesso de água sair. Comece com espaço para as raízes crescerem.</li>
   <li><strong>Acerte a luz e a rega.</strong> ${guide.care} Confira o substrato antes de regar e esvazie o pratinho após a água escorrer.</li>
   <li><strong>Modele a copa aos poucos.</strong> Escolha a forma que quer manter e, com ajuda de um adulto, encurte alguns ramos com tesoura limpa. ${guide.pruning}</li>
   <li><strong>Planeje a troca de vaso.</strong> Se as raízes estiverem apertadas ou a drenagem piorar, peça orientação para replantar. Deixe a poda de raízes para quem já tem experiência e dê tempo para a muda se recuperar antes de voltar a podar.</li>
   <li><strong>Acompanhe a evolução.</strong> Fotografe a árvore de frente e de lado no diário. Compare as fotos ao longo dos meses e siga com os cuidados de luz, água e adubação indicados para a planta.</li>
  </ol>
  <p class="mu">Referências <a href="https://www.pubs.ext.vt.edu/426/426-601/426-601.html" target="_blank" rel="noopener noreferrer">Guia de bonsai da Virginia Tech</a> · <a href="${guide.source[1]}" target="_blank" rel="noopener noreferrer">${guide.source[0]}</a></p>
  <button class="btn sec" type="button" onclick="infoPlant('${plant.id}')">Voltar à ficha</button>
  <button class="btn sec" type="button" onclick="closeM()">Fechar guia</button></div></div>`;
 $("#bonsai-title")?.focus?.();
}

 return `<div class="card pg3"><img class="pimg ${lk?"lock":""}" src="${pimg(p)}" alt="${esc(plantLabel(p,u))}"><div><b>${esc(plantLabel(p,u))}</b> ${rbadge(p)}<div class="mu">Dificuldade de cultivo: ${p.dif}</div><div class="mu">Bônus de descoberta: ${plantDiscoveryPoints(p)} pontos por espécie</div>${plantEquivalenceNote(u,p)}

 if(p&&!discovered(u,p)){const access=!!u;$('#modal').innerHTML=`<div class="modal"><div><img class="big" src="${mysteryPlant()}" alt="Planta a descobrir"><h2>${plantLabel(p,u)}</h2><p>${access?'Seu cultivo está liberado para registros e acompanhamento. Fotografe a planta quando ela tiver flores visíveis: a IA identificará a espécie e revelará sua ficha no catálogo.':'Escaneie o QR deste cultivo para começar. A identidade da planta será revelada somente por uma foto com flores reconhecidas pela IA.'}</p>${access?`<button class="btn" onclick="openID('${p.id}')">Fotografar flores</button><button class="btn sec" onclick="closeM();tmp.jp='${p.id}';jt(0);go('jour')">Acompanhar cultivo</button>`:`<button class="btn" onclick="window.JV_UNLOCKS.scan('${p.projectPlantId}')">Escanear QR desta planta</button>`}<button class="btn sec" onclick="closeM()">Fechar</button></div></div>`;return}

 <h3>Metas</h3>${GM(p).map(g=>{const a=own?prog(u,id,g):0,ok=own&&a>=g.b;return `<div style="margin:8px 0">${ok?"✔ ":"○ "}<b>${g.t}</b><div class="mu">${g.d}</div>${own?bar(a,g.b)+`<span class="mu">${a} de ${g.b}</span>`:""}</div>`}).join("")}
